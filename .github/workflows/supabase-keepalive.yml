# =============================================================================
# Supabase Keepalive: prevents free-tier auto-pause (7 days no requests)
# Pings the project every 5 days via REST / health endpoint.
# URL is hardcoded (public, not sensitive). Only the anon key is a secret.
# =============================================================================

name: Supabase Keepalive

on:
  schedule:
    # Every 5 days at 06:00 UTC
    - cron: '0 6 */5 * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # URL is hardcoded - not sensitive (public API endpoint)
          CLEAN_URL="https://fqasvhrzzhezluirnwtc.supabase.co"

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          echo "Pinging ${CLEAN_URL}/rest/v1/ ..."
          HTTP_CODE=$(curl --max-time 15 -s \
            -o /tmp/sb_body.txt \
            -w "%{http_code}" \
            "${CLEAN_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP code : ${HTTP_CODE}"
          echo "Body      : $(cat /tmp/sb_body.txt)"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "::notice::Keepalive ping successful (HTTP ${HTTP_CODE}). Project is active."
            exit 0
          fi

          # Fallback: auth health
          echo "REST returned ${HTTP_CODE}. Trying /auth/v1/health ..."
          AUTH_CODE=$(curl --max-time 15 -s \
            -o /tmp/sb_auth.txt \
            -w "%{http_code}" \
            "${CLEAN_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "Auth code : ${AUTH_CODE}"
          echo "Auth body : $(cat /tmp/sb_auth.txt)"

          if [ "$AUTH_CODE" -ge 200 ] && [ "$AUTH_CODE" -lt 400 ]; then
            echo "::notice::Auth keepalive successful (HTTP ${AUTH_CODE}). Project is active."
            exit 0
          fi

          echo "::error::All pings failed. REST=${HTTP_CODE} Auth=${AUTH_CODE}."
          exit 1
