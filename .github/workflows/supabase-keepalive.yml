# =============================================================================
# Supabase Keepalive: prevents free-tier auto-pause (7 days no requests)
# Pings the project every 5 days via REST / health endpoint.
# =============================================================================

name: Supabase Keepalive

on:
  schedule:
    # Every 5 days at 06:00 UTC
    - cron: '0 6 */5 * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # ---- Secret presence check ----
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          CLEAN_URL="${SUPABASE_URL%/}"
          echo "URL length : ${#CLEAN_URL}"
          echo "URL prefix : ${CLEAN_URL:0:8}"
          echo "URL suffix : ${CLEAN_URL: -12}"

          # ---- Ping with verbose curl (shows DNS, TLS, redirect details) ----
          echo "--- curl verbose ping to ${CLEAN_URL}/rest/v1/ ---"
          HTTP_CODE=$(curl -v --max-time 15 \
            -o /tmp/sb_body.txt \
            -w "%{http_code}" \
            "${CLEAN_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            2>&1 | tee /tmp/sb_verbose.txt | tail -1)

          # Re-read the http code from a clean run
          HTTP_CODE=$(curl --max-time 15 -s \
            -o /tmp/sb_body.txt \
            -w "%{http_code}" \
            "${CLEAN_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP code : ${HTTP_CODE}"
          echo "Body      : $(cat /tmp/sb_body.txt)"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "::notice::Keepalive ping successful (HTTP ${HTTP_CODE})."
            exit 0
          fi

          # ---- Fallback: auth health ----
          echo "--- Fallback: /auth/v1/health ---"
          AUTH_CODE=$(curl --max-time 15 -s \
            -o /tmp/sb_auth.txt \
            -w "%{http_code}" \
            "${CLEAN_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "Auth code : ${AUTH_CODE}"
          echo "Auth body : $(cat /tmp/sb_auth.txt)"

          if [ "$AUTH_CODE" -ge 200 ] && [ "$AUTH_CODE" -lt 400 ]; then
            echo "::notice::Auth keepalive successful (HTTP ${AUTH_CODE})."
            exit 0
          fi

          echo "::error::All pings failed. REST=${HTTP_CODE} Auth=${AUTH_CODE}."
          exit 1
