name: Auto-Register New Topics

on:
  push:
    branches: [main]
    paths:
      - "pages/**/*.vue"   # Only runs when a note page is added or changed

permissions:
  contents: write

jobs:
  auto-register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests google-genai

      - name: Auto-register new topics and run backfill
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_CLOUD_PROJECT:                ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: python3 workers/scrapy-pib/auto_register.py

      - name: Commit updated scraper + new current affairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workers/scrapy-pib/scraper.py
          git add content/current-affairs/
          git diff --cached --quiet || git commit -m "auto: register new topics + backfill current affairs [skip ci]"
          git push
