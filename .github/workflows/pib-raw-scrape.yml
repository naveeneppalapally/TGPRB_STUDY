name: PIB Raw Articles Scraper (Full Data Engine)

on:
  workflow_dispatch:

jobs:
  scrape-chunks:
    name: "${{ matrix.chunk.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk:
          # --from/--to  = exact save window (1 full month)
          # --scan-from  = 1 month earlier so PRID estimation always starts before month day 1
          - { name: "2025-01", from: "2025-01-01", to: "2025-01-31", scan_from: "2024-12-01" }
          - { name: "2025-02", from: "2025-02-01", to: "2025-02-28", scan_from: "2025-01-01" }
          - { name: "2025-03", from: "2025-03-01", to: "2025-03-31", scan_from: "2025-02-01" }
          - { name: "2025-04", from: "2025-04-01", to: "2025-04-30", scan_from: "2025-03-01" }
          - { name: "2025-05", from: "2025-05-01", to: "2025-05-31", scan_from: "2025-04-01" }
          - { name: "2025-06", from: "2025-06-01", to: "2025-06-30", scan_from: "2025-05-01" }
          - { name: "2025-07", from: "2025-07-01", to: "2025-07-31", scan_from: "2025-06-01" }
          - { name: "2025-08", from: "2025-08-01", to: "2025-08-31", scan_from: "2025-07-01" }
          - { name: "2025-09", from: "2025-09-01", to: "2025-09-30", scan_from: "2025-08-01" }
          - { name: "2025-10", from: "2025-10-01", to: "2025-10-31", scan_from: "2025-09-01" }
          - { name: "2025-11", from: "2025-11-01", to: "2025-11-30", scan_from: "2025-10-01" }
          - { name: "2025-12", from: "2025-12-01", to: "2025-12-31", scan_from: "2025-11-01" }
          - { name: "2026-01", from: "2026-01-01", to: "2026-01-31", scan_from: "2025-12-01" }
          - { name: "2026-02", from: "2026-02-01", to: "2026-02-28", scan_from: "2026-01-01" }
          - { name: "2026-03", from: "2026-03-01", to: "2026-03-31", scan_from: "2026-02-01" }
          - { name: "2026-04", from: "2026-04-01", to: "2026-04-30", scan_from: "2026-03-01" }
          - { name: "2026-05", from: "2026-05-01", to: "2026-05-31", scan_from: "2026-04-01" }
          - { name: "2026-06", from: "2026-06-01", to: "2026-06-30", scan_from: "2026-05-01" }
          - { name: "2026-07", from: "2026-07-01", to: "2026-07-31", scan_from: "2026-06-01" }
          - { name: "2026-08", from: "2026-08-01", to: "2026-08-10", scan_from: "2026-07-01" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run Raw Scraper for ${{ matrix.chunk.name }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 workers/scrapy-pib/pib_raw_scraper.py \
            --from      "${{ matrix.chunk.from }}"      \
            --to        "${{ matrix.chunk.to }}"        \
            --scan-from "${{ matrix.chunk.scan_from }}" \
            --workers 20 \
            --rps 20.0

      - name: Show results
        run: python3 workers/scrapy-pib/pib_raw_scraper.py --stats

      - name: Export chunk to CSV
        run: |
          python3 workers/scrapy-pib/pib_raw_scraper.py \
            --export "pib_raw_${{ matrix.chunk.name }}.csv"

      - name: Upload chunk CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: "pib-raw-${{ matrix.chunk.name }}"
          path: "pib_raw_${{ matrix.chunk.name }}.csv"
          retention-days: 7

  merge-all:
    name: "Merge All 20 Months → Master Dataset"
    needs: scrape-chunks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./chunks
          pattern: pib-raw-*

      - name: Merge all CSVs → master SQLite + CSV
        run: |
          python3 - << 'EOF'
          import csv, glob, sqlite3, os

          DB_OUT  = "pib_master_2025_2026.db"
          CSV_OUT = "pib_master_2025_2026.csv"

          con = sqlite3.connect(DB_OUT)
          con.execute("""
            CREATE TABLE articles (
              prid INTEGER PRIMARY KEY,
              title TEXT, pub_date TEXT, ministry TEXT, office TEXT,
              full_text TEXT, url TEXT, word_count INTEGER, scraped_at TEXT
            )
          """)

          csv_files = sorted(glob.glob("./chunks/**/*.csv", recursive=True))
          print(f"Found {len(csv_files)} CSV chunks to merge")
          total = 0

          with open(CSV_OUT, "w", newline="", encoding="utf-8") as master:
              writer = None
              for fpath in csv_files:
                  with open(fpath, "r", encoding="utf-8") as f:
                      reader = csv.reader(f)
                      header = next(reader, None)
                      if not header: continue
                      if writer is None:
                          writer = csv.writer(master)
                          writer.writerow(header)
                      chunk_count = 0
                      for row in reader:
                          if not row or len(row) < 8: continue
                          try:
                              con.execute(
                                "INSERT OR IGNORE INTO articles VALUES (?,?,?,?,?,?,?,?,?)",
                                (int(row[0]), row[1], row[2], row[3], row[4],
                                 row[5], row[6], int(row[7] or 0), row[8] if len(row)>8 else ""))
                              writer.writerow(row)
                              chunk_count += 1
                              total += 1
                          except Exception: pass
                      print(f"  {os.path.basename(fpath)}: {chunk_count} articles")

          con.commit()
          db_mb  = os.path.getsize(DB_OUT)  / (1024*1024)
          csv_mb = os.path.getsize(CSV_OUT) / (1024*1024)
          print(f"\nDONE: {total:,} total articles")
          print(f"  SQLite: {DB_OUT} ({db_mb:.1f} MB)")
          print(f"  CSV   : {CSV_OUT} ({csv_mb:.1f} MB)")

          rows = con.execute("SELECT MIN(pub_date), MAX(pub_date), COUNT(*) FROM articles").fetchone()
          print(f"  Range : {rows[0]} to {rows[1]} ({rows[2]:,} unique articles)")
          print("\nTop ministries:")
          for m, c in con.execute("SELECT ministry, COUNT(*) n FROM articles WHERE ministry!='' GROUP BY ministry ORDER BY n DESC LIMIT 10"):
              print(f"  {c:5d}  {m}")
          EOF

      - name: Upload master dataset
        uses: actions/upload-artifact@v4
        with:
          name: pib-master-dataset-2025-2026
          path: |
            pib_master_2025_2026.db
            pib_master_2025_2026.csv
          retention-days: 30
