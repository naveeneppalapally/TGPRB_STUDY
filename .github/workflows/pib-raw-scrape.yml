name: PIB Raw Articles Scraper (Full Data Engine)

on:
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM, or all for the rolling 365-day window"
        required: true
        default: "all"
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.matrix.outputs.chunks }}
    steps:
      - id: matrix
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PYTHON'
          import calendar, json, os
          from datetime import date, timedelta
          requested = os.environ['REQUESTED_MONTH']
          today = date.today()
          first = today - timedelta(days=365) if requested == 'all' else date.fromisoformat(requested + '-01')
          last = today if requested == 'all' else first.replace(day=calendar.monthrange(first.year,first.month)[1])
          chunks = []
          current = first
          while current <= last:
              previous = (current - timedelta(days=1)).replace(day=1)
              month_end = current.replace(day=calendar.monthrange(current.year,current.month)[1])
              end = min(last, month_end)
              chunks.append(dict(name=current.strftime('%Y-%m'), **{'from':current.isoformat(),'to':end.isoformat(),'scan_from':previous.isoformat()}))
              current = month_end + timedelta(days=1)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('chunks=' + json.dumps(chunks) + '\n')
          PYTHON
  scrape-chunks:
    needs: plan
    name: "${{ matrix.chunk.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r workers/scrapy-pib/requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: workers/scrapy-pib/pib_raw.db
          key: pib-raw-${{ matrix.chunk.name }}-${{ github.run_id }}
          restore-keys: pib-raw-${{ matrix.chunk.name }}-

      - name: Run Raw Scraper for ${{ matrix.chunk.name }}
        if: ${{ success() }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 workers/scrapy-pib/pib_raw_scraper.py \
            --from      "${{ matrix.chunk.from }}"      \
            --to        "${{ matrix.chunk.to }}"        \
            --scan-from "${{ matrix.chunk.scan_from }}" \
            --workers 20 \
            --rps 15.0

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: workers/scrapy-pib/pib_raw.db
          key: pib-raw-${{ matrix.chunk.name }}-${{ github.run_id }}

      - name: Show results
        if: ${{ success() }}
        run: python3 workers/scrapy-pib/pib_raw_scraper.py --stats

      - name: Export chunk to CSV
        if: ${{ success() }}
        run: |
          python3 workers/scrapy-pib/pib_raw_scraper.py \
            --export "pib_raw_${{ matrix.chunk.name }}.csv"

      - name: Upload chunk CSV artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: "pib-raw-${{ matrix.chunk.name }}"
          path: "pib_raw_${{ matrix.chunk.name }}.csv"
          retention-days: 7

  merge-all:
    name: "Merge rolling chunks into the master dataset"
    needs: scrape-chunks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.month == 'all' && success() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./chunks
          pattern: pib-raw-*

      - name: Merge all CSVs → master SQLite + CSV
        run: |
          python3 - << 'EOF'
          import csv, glob, sqlite3, os

          DB_OUT  = "pib_master_2025_2026.db"
          CSV_OUT = "pib_master_2025_2026.csv"

          con = sqlite3.connect(DB_OUT)
          con.execute("""
            CREATE TABLE IF NOT EXISTS articles (
              prid INTEGER PRIMARY KEY,
              title TEXT, pub_date TEXT, ministry TEXT, office TEXT,
              full_text TEXT, url TEXT, word_count INTEGER, scraped_at TEXT
            )
          """)

          csv_files = sorted(glob.glob("./chunks/**/*.csv", recursive=True))
          print(f"Found {len(csv_files)} CSV chunks to merge")
          total = 0

          columns = ["prid", "title", "pub_date", "ministry", "office", "full_text", "url", "word_count", "scraped_at"]
          if not csv_files: raise RuntimeError("No PIB chunks were downloaded")
          for fpath in csv_files:
              with open(fpath, "r", encoding="utf-8") as source:
                  reader = csv.reader(source)
                  if next(reader, None) != columns: raise ValueError(f"Unexpected CSV schema: {fpath}")
                  for line, row in enumerate(reader, 2):
                      if len(row) != len(columns): raise ValueError(f"Malformed CSV row: {fpath}:{line}")
                      values = (int(row[0]), *row[1:7], int(row[7]), row[8])
                      con.execute("""
                        INSERT INTO articles VALUES (?,?,?,?,?,?,?,?,?)
                        ON CONFLICT(prid) DO UPDATE SET title=excluded.title, pub_date=excluded.pub_date,
                          ministry=excluded.ministry, office=excluded.office, full_text=excluded.full_text,
                          url=excluded.url, word_count=excluded.word_count, scraped_at=excluded.scraped_at
                        WHERE excluded.scraped_at > articles.scraped_at
                      """, values)
                      total += 1
          con.commit()
          with open(CSV_OUT, "w", newline="", encoding="utf-8") as master:
              writer = csv.writer(master)
              writer.writerow(columns)
              writer.writerows(con.execute("SELECT * FROM articles ORDER BY prid"))
          print(f"Merged {total:,} input rows; CSV is exported from the deduplicated SQLite master")
          db_mb  = os.path.getsize(DB_OUT)  / (1024*1024)
          csv_mb = os.path.getsize(CSV_OUT) / (1024*1024)
          print(f"\nDONE: {total:,} total articles")
          print(f"  SQLite: {DB_OUT} ({db_mb:.1f} MB)")
          print(f"  CSV   : {CSV_OUT} ({csv_mb:.1f} MB)")

          rows = con.execute("SELECT MIN(pub_date), MAX(pub_date), COUNT(*) FROM articles").fetchone()
          print(f"  Range : {rows[0]} to {rows[1]} ({rows[2]:,} unique articles)")
          print("\nTop ministries:")
          for m, c in con.execute("SELECT ministry, COUNT(*) n FROM articles WHERE ministry!='' GROUP BY ministry ORDER BY n DESC LIMIT 10"):
              print(f"  {c:5d}  {m}")
          EOF

      - name: Upload master dataset
        uses: actions/upload-artifact@v4
        with:
          name: pib-master-dataset-2025-2026
          path: |
            pib_master_2025_2026.db
            pib_master_2025_2026.csv
          retention-days: 30
