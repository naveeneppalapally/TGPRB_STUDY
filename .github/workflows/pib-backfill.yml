name: PIB Backfill (Manual)

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD) - kept for records only, scraper processes today"
        required: false
        default: "2025-01-01"
      to_date:
        description: "End date (YYYY-MM-DD, default: today)"
        required: false
        default: ""
      max_per_day:
        description: "Max releases to process (default: 30)"
        required: false
        default: "30"

jobs:
  pib-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-genai

      - name: Run PIB scraper (fetches today's releases)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
        run: |
          today=$(date +%Y-%m-%d)
          python3 workers/scrapy-pib/pib_scraper.py \
            --from "$today" \
            --to   "$today" \
            --max-per-day "${{ github.event.inputs.max_per_day || '30' }}"

      - name: Count new files
        id: count
        run: |
          count=$(git status --short content/current-affairs/ | grep "^?" | wc -l)
          echo "new_files=$count" >> $GITHUB_OUTPUT
          echo "New exam cards generated: $count"

      - name: Commit and push
        if: steps.count.outputs.new_files != '0'
        run: |
          git config user.name  "PIB Scraper Bot"
          git config user.email "actions@github.com"
          git add content/current-affairs/
          git commit -m "add: PIB exam cards $(date +%Y-%m-%d) (${{ steps.count.outputs.new_files }} cards) [skip ci]"
          git push
