name: Daily PIB Current Affairs Scraper

on:
  schedule:
    # Runs daily at 01:30 UTC (7:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Start date (YYYY-MM-DD). Leave blank to resume the saved backlog.'
        required: false
        default: ''
      to_date:
        description: 'End date (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: pib-daily
  cancel-in-progress: false

jobs:
  pib-daily-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Queued backfills must include the previous scraper's bot commit.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r workers/scrapy-pib/requirements.txt

      - name: Calculate dates
        id: dates
        env:
          INPUT_FROM: ${{ inputs.from_date }}
          INPUT_TO: ${{ inputs.to_date }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          from datetime import date, timedelta
          state = Path('data/ca_ingestion_state.json')
          ledger = json.loads(state.read_text()) if state.exists() else {}
          cursor = ledger.get('last_completed_date')
          today = date.today()
          start = date.fromisoformat(os.environ['INPUT_FROM']) if os.environ.get('INPUT_FROM') else (date.fromisoformat(cursor) - timedelta(days=2) if cursor else date.fromisoformat(ledger['backfill_from_date']) if ledger.get('backfill_from_date') else today - timedelta(days=3))
          end = date.fromisoformat(os.environ['INPUT_TO']) if os.environ.get('INPUT_TO') else today
          if start > end: raise ValueError('Start must not follow end')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'from_date={start}\nto_date={end}\n')
          PYTHON

      - name: Run PIB Daily Scraper
        env:
          # AI Studio Developer API; do not select the billing-blocked Vertex backend.
          GEMINI_API_KEY:                     ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED:                   "1"
        run: |
          timeout --signal=INT --kill-after=30s 20m python3 workers/scrapy-pib/pib_scraper.py \
            --from "${{ steps.dates.outputs.from_date }}" \
            --to "${{ steps.dates.outputs.to_date }}" \
            --max-per-day 0

      - name: Sync Topic Mappings
        if: always()
        run: |
          python3 scripts/pib_ca_pipeline/sync_ca_topics.py

      - name: Validate every generated card
        id: validate
        if: always()
        run: python3 scripts/pib_ca_pipeline/verify_ca_cards.py

      - name: Preserve ingestion recovery snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pib-ingestion-${{ github.run_id }}
          retention-days: 7
          path: |
            content/current-affairs/
            data/ca_ingestion_state.json

      - name: Persist cards, retags and retry ledger
        if: always()
        env:
          CARDS_VALID: ${{ steps.validate.outcome }}
        run: |
          git config user.name "PIB Daily Bot"
          git config user.email "actions@github.com"
          if [ "$CARDS_VALID" = "success" ]; then git add content/current-affairs/; fi
          if [ -f data/ca_ingestion_state.json ]; then git add data/ca_ingestion_state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist PIB cards and ingestion outcomes"
            git pull --rebase origin main
            git push
          fi
