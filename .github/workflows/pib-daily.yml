name: Daily PIB Current Affairs Scraper

on:
  schedule:
    # Runs daily at 01:30 UTC (7:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Start date (YYYY-MM-DD). Leave blank for auto (last 3 days).'
        required: false
        default: ''
      to_date:
        description: 'End date (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''

jobs:
  pib-daily-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --retries 5 --timeout 30 requests beautifulsoup4 google-genai || \
          python -m pip install --index-url https://pypi.org/simple/ requests beautifulsoup4 google-genai

      - name: Calculate dates
        id: dates
        run: |
          if [ -n "${{ inputs.from_date }}" ]; then
            FROM="${{ inputs.from_date }}"
            TO="${{ inputs.to_date || inputs.from_date }}"
          else
            # Daily run at 7 AM IST: yesterday's PIB releases are fully published
            FROM=$(date -d "1 day ago" +%Y-%m-%d)
            TO=$FROM
          fi
          echo "from_date=$FROM" >> $GITHUB_OUTPUT
          echo "to_date=$TO" >> $GITHUB_OUTPUT
          echo "Scraping PIB for: $FROM to $TO"

      - name: Run PIB Daily Scraper
        env:
          GOOGLE_CLOUD_PROJECT:               ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY:                     ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED:                   "1"
        run: |
          python3 workers/scrapy-pib/pib_scraper.py \
            --from "${{ steps.dates.outputs.from_date }}" \
            --to "${{ steps.dates.outputs.to_date }}" \
            --max-per-day 30

      - name: Count new files
        id: count
        run: |
          count=$(git status --short content/current-affairs/ | grep "^?" | wc -l)
          echo "new_files=$count" >> $GITHUB_OUTPUT

      - name: Commit and push new exam cards
        if: steps.count.outputs.new_files != '0'
        run: |
          git config user.name  "PIB Daily Bot"
          git config user.email "actions@github.com"
          git add content/current-affairs/
          git commit -m "add: daily PIB current affairs updates (${{ steps.count.outputs.new_files }} cards) [skip ci]"
          git push
