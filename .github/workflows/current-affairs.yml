name: Daily Current Affairs Scraper

on:
  schedule:
    # Runs every day at 7:00 AM IST (01:30 UTC)
    - cron: "30 1 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests google-genai

      - name: Run current affairs scraper
        env:
          TELEGRAM_BOT_TOKEN:                    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:                      ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON:   ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_CLOUD_PROJECT:                  ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: python workers/scrapy-pib/scraper.py

      - name: Commit new current affairs entries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/current-affairs/
          git diff --cached --quiet || git commit -m "ca: daily current affairs update [skip ci]"
          git push
