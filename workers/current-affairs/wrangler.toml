name = "tslprb-current-affairs"
main = "index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Runs every day at 07:00 AM IST (01:30 UTC)
[triggers]
crons = ["30 1 * * *"]

# KV namespace for deduplication (prevents re-adding same news item)
[[kv_namespaces]]
binding = "CA_SEEN"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Environment variables (non-secret)
[vars]
GITHUB_REPO   = "naveeneppalapally/TGPRB_STUDY"
GITHUB_BRANCH = "main"

# Secrets - set these via CLI (never commit actual values):
# npx wrangler secret put GITHUB_TOKEN
# npx wrangler secret put TELEGRAM_BOT_TOKEN
# npx wrangler secret put TELEGRAM_CHAT_ID
