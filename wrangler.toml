name = "tslprb-studyos"
pages_build_output_dir = "dist"
compatibility_date = "2025-05-15"

# nodejs_compat is required because @nuxtjs/supabase and several Nuxt internals
# use Node.js APIs (Buffer, crypto, process) that are not available in the
# standard Cloudflare Workers runtime. This flag polyfills them at the edge.
compatibility_flags = ["nodejs_compat"]

# NOTE: Do NOT put SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_KEY here.
# Set them as encrypted environment variables in the Cloudflare Pages dashboard
# under Settings > Environment variables. They will be injected at build time
# and runtime automatically without ever touching this file.
